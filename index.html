<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prime Flix</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#09090f;color:white;font-family:Arial,sans-serif}
header{background:#171720;padding:24px 16px;text-align:center}
h1{color:#e50914}
button{padding:12px 18px;background:#e50914;color:white;border:0;border-radius:9px;cursor:pointer}
input{width:100%;max-width:480px;padding:14px;border:0;border-radius:10px;margin:15px auto}
main{padding:20px}
.catalogo{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:15px}
.card{background:#20202c;border-radius:12px;overflow:hidden;padding-bottom:15px}
.capa{width:100%;height:210px;object-fit:cover;background:#30303c}
.card h3,.card p{margin:12px;overflow-wrap:anywhere}
.card button{margin:5px 12px}
#perfil{display:none;margin:15px}
#foto{width:45px;height:45px;border-radius:50%}
video{width:100%;max-width:700px;border-radius:12px}
#playerBox{margin-top:25px}
#status{color:#aaa}
</style>
</head>
<body>
<header>
<h1>🎬 PRIME FLIX</h1>
<p>Filmes, séries e animes em um só lugar!</p>
<button id="entrar" disabled>Carregando...</button>
<div id="perfil">
<img id="foto" alt="Foto">
<p id="nome"></p>
<button id="sair">Sair</button>
</div>
<p id="loginStatus"></p>
<input id="busca" placeholder="🔎 Pesquisar filmes, séries e animes">
</header>
<main>
<h2>🍿 Catálogo</h2>
<p id="status">Carregando conteúdos...</p>
<div id="catalogo" class="catalogo"></div>
<section id="playerBox" hidden>
<h2 id="playerTitulo"></h2>
<video id="player" controls playsinline></video>
</section>
</main>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";
import {getFirestore,collection,onSnapshot} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

const config={
apiKey:"AIzaSyAwdh-gDSLvuT5SLObn7oLU2rMLPcqUcs0",
authDomain:"prime-flix-ca7aa.firebaseapp.com",
projectId:"prime-flix-ca7aa",
storageBucket:"prime-flix-ca7aa.firebasestorage.app",
messagingSenderId:"227931199847",
appId:"1:227931199847:web:dd25ad57e1bd47aa3237c2"
};

const app=initializeApp(config);
const auth=getAuth(app);
const db=getFirestore(app);
const $=id=>document.getElementById(id);
let itens=[];

function urlSegura(url){
try{
const u=new URL(url);
return u.protocol==="https:"?u.href:null;
}catch{return null}
}

$("entrar").disabled=false;
$("entrar").textContent="🔐 Entrar com Google";
$("entrar").onclick=async()=>{
try{
await signInWithPopup(auth,new GoogleAuthProvider());
}catch(e){
if(e.code!=="auth/popup-closed-by-user")
$("loginStatus").textContent="Erro no login: "+e.code;
}
};
$("sair").onclick=()=>signOut(auth);

onAuthStateChanged(auth,user=>{
$("entrar").style.display=user?"none":"inline-block";
$("perfil").style.display=user?"block":"none";
if(user){
$("nome").textContent=user.displayName||"Usuário";
$("foto").src=user.photoURL||"";
$("foto").hidden=!user.photoURL;
}
});

function mostrar(){
const termo=$("busca").value.toLowerCase();
const lista=itens.filter(x=>
(x.titulo||"").toLowerCase().includes(termo)||
(x.categoria||"").toLowerCase().includes(termo)
);
$("catalogo").replaceChildren();
$("status").textContent=lista.length?"": "Nenhum conteúdo encontrado.";

lista.forEach(item=>{
const card=document.createElement("article");
card.className="card";
const capa=urlSegura(item.capa);
if(capa){
const img=document.createElement("img");
img.className="capa";
img.src=capa;
img.alt="Capa de "+(item.titulo||"Conteúdo");
card.append(img);
}
const titulo=document.createElement("h3");
titulo.textContent=item.titulo||"Sem título";
const categoria=document.createElement("p");
categoria.textContent=item.categoria||"Conteúdo";
const descricao=document.createElement("p");
descricao.textContent=item.descricao||"";
card.append(titulo,categoria,descricao);

const video=urlSegura(item.video);
if(video){
const botao=document.createElement("button");
botao.textContent="▶ Assistir";
botao.onclick=()=>{
$("playerTitulo").textContent=item.titulo||"Assistir";
$("player").pause();
$("player").src=video;
$("playerBox").hidden=false;
$("playerBox").scrollIntoView({behavior:"smooth"});
};
card.append(botao);
}
$("catalogo").append(card);
});
}

$("busca").addEventListener("input",mostrar);

onSnapshot(collection(db,"conteudos"),snapshot=>{
itens=snapshot.docs.map(doc=>({id:doc.id,...doc.data()}));
mostrar();
},error=>{
$("status").textContent="Erro ao carregar catálogo: "+error.code;
});
</script>
</body>
</html>
