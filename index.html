
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prime Flix</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090b12;color:white;font-family:Arial,sans-serif}
header{background:#141824;padding:22px 16px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:25px;font-weight:bold;color:#ff344f}
nav{display:flex;gap:12px;flex-wrap:wrap}
nav a{color:white;text-decoration:none;font-size:13px}
.hero{padding:65px 20px;text-align:center;background:linear-gradient(135deg,#31132e,#10172a)}
.hero h1{font-size:36px;margin:0}
.hero p{color:#ddd}
button{background:#f43652;color:white;border:0;border-radius:9px;padding:12px 18px;cursor:pointer}
main{padding:22px 16px}
input{width:100%;padding:15px;border:1px solid #41465a;border-radius:10px;background:#1b2030;color:white;font-size:16px}
.filters{display:flex;gap:8px;margin:18px 0;flex-wrap:wrap}
.filters button{background:#292d3d}
.filters button.active{background:#f43652}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
.card{background:#1a1e2c;border-radius:12px;overflow:hidden}
.poster{height:175px;background:linear-gradient(135deg,#64244c,#25385f);display:flex;align-items:center;justify-content:center;font-size:54px}
.info{padding:13px}
.info h3{margin:0 0 8px;font-size:16px}
.info p{color:#b7b7c6;font-size:13px}
.info button{width:100%}
#player{margin-top:24px}
video{width:100%;border-radius:12px}
footer{text-align:center;color:#999;padding:35px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header>
<div class="logo">▶ PRIME FLIX</div>
<nav>
<a href="#catalogo">Início</a>
<a href="#catalogo">Catálogo</a>
<a href="#admin">Admin</a>
</nav>
</header>
<section class="hero">
<h1>Bem-vindo ao Prime Flix</h1>
<p>Seu espaço para descobrir animes, filmes e séries.</p>
<a href="#catalogo"><button>Explorar catálogo</button></a>
</section>
<main>
<section id="catalogo">
<h2>🎬 Catálogo</h2>
<input id="busca" placeholder="Pesquisar títulos..." oninput="mostrar()">
<div class="filters">
<button class="active" onclick="filtrar('Todos',this)">Todos</button>
<button onclick="filtrar('Anime',this)">Animes</button>
<button onclick="filtrar('Filme',this)">Filmes</button>
<button onclick="filtrar('Série',this)">Séries</button>
</div>
<div id="lista" class="grid"></div>
</section>
<section id="player"></section>
<section id="admin">
<h2>🔐 Administração</h2>
<p>Área de gerenciamento em preparação.</p>
<p>O login seguro será configurado antes de permitir publicações.</p>
</section>
</main>
<footer>© 2026 Prime Flix</footer>
<script>
const catalogo=[
{nome:"Anime de aventura",tipo:"Anime",icone:"⚔️"},
{nome:"Anime de fantasia",tipo:"Anime",icone:"🐉"},
{nome:"Filme de ação",tipo:"Filme",icone:"🎥"},
{nome:"Série de mistério",tipo:"Série",icone:"🌙"}
];
let categoria="Todos";
function filtrar(tipo,botao){
categoria=tipo;
document.querySelectorAll(".filters button").forEach(b=>b.classList.remove("active"));
botao.classList.add("active");
mostrar();
}
function mostrar(){
const busca=document.getElementById("busca").value.toLowerCase();
const lista=document.getElementById("lista");
lista.innerHTML="";
catalogo.filter(item=>(categoria==="Todos"||item.tipo===categoria)&&item.nome.toLowerCase().includes(busca)).forEach(item=>{
const card=document.createElement("div");
card.className="card";
card.innerHTML='<div class="poster">'+item.icone+'</div><div class="info"><h3>'+item.nome+'</h3><p>'+item.tipo+'</p><button>Ver detalhes</button></div>';
card.querySelector("button").onclick=()=>alert("Conteúdo em breve!");
lista.appendChild(card);
});
if(!lista.children.length)lista.textContent="Nenhum título encontrado.";
}
mostrar();
</script>

</body>
</html>
