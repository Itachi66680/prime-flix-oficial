<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prime Flix | Administração</title>
<style>
:root{color-scheme:dark;--red:#e50914;--bg:#08080a;--panel:#17171d;--muted:#b5b5c2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:white;font:16px system-ui,-apple-system,Arial,sans-serif}header{padding:18px 5%;display:flex;align-items:center;justify-content:space-between;background:#121216;border-bottom:1px solid #2e2e35}a{color:#fff;text-decoration:none}.brand{font-size:25px;font-weight:900;letter-spacing:.5px}.brand span{color:var(--red)}main{max-width:1040px;margin:auto;padding:30px 18px}h1{font-size:clamp(24px,5vw,38px)}h2{font-size:20px}p{color:var(--muted);line-height:1.5}.panel{background:var(--panel);padding:22px;border:1px solid #2a2a31;border-radius:16px;margin:20px 0}button{border:0;color:white;background:var(--red);border-radius:9px;padding:12px 17px;font-weight:700;cursor:pointer;font-size:15px}button:disabled{opacity:.5;cursor:not-allowed}.secondary{background:#393941}.danger{background:#8c252b}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #f88;outline-offset:2px}input,textarea,select{width:100%;background:#101016;border:1px solid #464651;padding:13px;border-radius:9px;color:white;font:inherit}label{display:block;font-size:14px;margin-bottom:14px;color:#e1e1e7}label input,label textarea,label select{margin-top:6px}textarea{min-height:90px;resize:vertical}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.item{padding:14px;border:1px solid #33333b;border-radius:12px;margin-top:12px;display:flex;gap:16px;align-items:center;justify-content:space-between}.item p{margin:5px 0;font-size:14px;overflow-wrap:anywhere}.poster{width:64px;height:88px;object-fit:cover;border-radius:7px;background:#282833}.summary{flex:1;min-width:0}.status{font-size:14px;min-height:20px}.hidden{display:none!important}@media(max-width:600px){.grid{grid-template-columns:1fr}.item{flex-wrap:wrap}.item .actions{width:100%}header{padding:16px}}
</style>
</head>
<body>
<header><div class="brand">PRIME <span>FLIX</span></div><a href="./">← Voltar ao site</a></header>
<main>
<h1>👑 Painel de administrador</h1>
<p>Gerencie os títulos do catálogo Prime Flix. Publique apenas vídeos que você tenha autorização para disponibilizar.</p>
<div id="loginBox" class="panel"><h2>Entrar na administração</h2><p>Use sua conta Google autorizada.</p><button id="loginBtn">Entrar com Google</button><p id="loginStatus" class="status" role="status"></p></div>
<div id="appBox" class="hidden">
  <div class="panel"><div class="actions" style="justify-content:space-between"><p id="who" style="margin:0"></p><button class="secondary" id="logoutBtn">Sair</button></div></div>
  <section class="panel"><h2 id="formTitle">Adicionar conteúdo</h2><form id="contentForm">
    <div class="grid"><label>Título <input name="titulo" required maxlength="120" placeholder="Nome do filme ou anime"></label><label>Categoria <select name="categoria"><option>Filme</option><option>Série</option><option>Anime</option></select></label></div>
    <label>Descrição <textarea name="descricao" maxlength="1000" placeholder="Sinopse do conteúdo"></textarea></label>
    <label>URL da capa (https) <input name="capa" type="url" placeholder="https://exemplo.com/capa.jpg"></label>
    <label>URL do vídeo autorizado (https) <input name="video" type="url" placeholder="https://exemplo.com/video.mp4"></label>
    <div class="actions"><button type="submit" id="submitBtn">Publicar conteúdo</button><button type="button" class="secondary hidden" id="cancelBtn">Cancelar edição</button></div>
    <p class="status" id="formStatus" role="status"></p>
  </form></section>
  <section class="panel"><h2>Conteúdos cadastrados</h2><p id="listStatus" role="status">Carregando catálogo…</p><div id="items"></div></section>
</div>
</main>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js';
import {getFirestore,collection,addDoc,updateDoc,deleteDoc,doc,onSnapshot,serverTimestamp} from 'https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js';
const firebaseConfig={apiKey:'AIzaSyAwdh-gDSLvuT5SLObn7oLU2rMLPcqUcs0',authDomain:'prime-flix-ca7aa.firebaseapp.com',projectId:'prime-flix-ca7aa',storageBucket:'prime-flix-ca7aa.firebasestorage.app',messagingSenderId:'227931199847',appId:'1:227931199847:web:391e2afb1532c6de3237c2'};
const ADMIN_UID='CJzmV3mKGTf3TWpwbmOSKJW3cPv1';
const firebase=initializeApp(firebaseConfig),auth=getAuth(firebase),db=getFirestore(firebase),contents=collection(db,'conteudos');
const $=id=>document.getElementById(id);let stop=null,editing=null,records=new Map();
function status(id,msg){$(id).textContent=msg}
$('loginBtn').addEventListener('click',async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){status('loginStatus','Não foi possível entrar: '+e.code)}});
$('logoutBtn').addEventListener('click',()=>signOut(auth));
function resetForm(){$('contentForm').reset();editing=null;$('formTitle').textContent='Adicionar conteúdo';$('submitBtn').textContent='Publicar conteúdo';$('cancelBtn').classList.add('hidden');status('formStatus','')}
$('cancelBtn').addEventListener('click',resetForm);
onAuthStateChanged(auth,user=>{
 if(stop){stop();stop=null}records.clear();$('items').replaceChildren();resetForm();
 const isAdmin=Boolean(user&&user.uid===ADMIN_UID);
 $('loginBox').classList.toggle('hidden',isAdmin);$('appBox').classList.toggle('hidden',!isAdmin);
 if(!isAdmin){status('loginStatus',user?'Esta conta não tem permissão de administrador. Entre com a conta autorizada.':'');return}
 $('who').textContent='Conectado como '+(user.displayName||user.email||'administrador');
 stop=onSnapshot(contents,snapshot=>{records.clear();$('items').replaceChildren();snapshot.forEach(d=>{records.set(d.id,d.data());drawItem(d.id,d.data())});status('listStatus',snapshot.empty?'Nenhum conteúdo cadastrado.':snapshot.size+' conteúdo(s) cadastrado(s).')},e=>status('listStatus','Não foi possível carregar: '+e.code));
});
function validHttps(url){if(!url)return true;try{return new URL(url).protocol==='https:'}catch{return false}}
$('contentForm').addEventListener('submit',async event=>{
 event.preventDefault();if(auth.currentUser?.uid!==ADMIN_UID)return status('formStatus','Sem permissão.');
 const f=new FormData(event.currentTarget);const data={titulo:String(f.get('titulo')||'').trim(),categoria:String(f.get('categoria')||'Filme'),descricao:String(f.get('descricao')||'').trim(),capa:String(f.get('capa')||'').trim(),video:String(f.get('video')||'').trim()};
 if(!data.titulo)return status('formStatus','Informe o título.');
 if(!validHttps(data.capa)||!validHttps(data.video))return status('formStatus','Use endereços https válidos para a capa e o vídeo.');
 $('submitBtn').disabled=true;status('formStatus','Salvando…');
 try{if(editing){await updateDoc(doc(db,'conteudos',editing),{...data,atualizadoEm:serverTimestamp()})}else{await addDoc(contents,{...data,criadoEm:serverTimestamp()})}resetForm();status('formStatus','Conteúdo salvo no Firestore!')}
 catch(e){status('formStatus','Erro ao salvar: '+e.code)}finally{$('submitBtn').disabled=false}
});
function drawItem(id,data){let item=document.createElement('article');item.className='item';
 if(validHttps(data.capa)&&data.capa){let img=document.createElement('img');img.className='poster';img.alt='Capa de '+(data.titulo||'conteúdo');img.src=data.capa;img.referrerPolicy='no-referrer';item.append(img)}
 let summary=document.createElement('div');summary.className='summary';let strong=document.createElement('strong');strong.textContent=data.titulo||'Sem título';let sub=document.createElement('p');sub.textContent=data.categoria||'';summary.append(strong,sub);item.append(summary);
 let actions=document.createElement('div');actions.className='actions';let edit=document.createElement('button');edit.className='secondary';edit.textContent='Editar';edit.addEventListener('click',()=>{editing=id;for(let field of ['titulo','categoria','descricao','capa','video'])$('contentForm').elements[field].value=data[field]||'';$('formTitle').textContent='Editar conteúdo';$('submitBtn').textContent='Salvar edição';$('cancelBtn').classList.remove('hidden');$('contentForm').scrollIntoView({behavior:'smooth'});status('formStatus','')});
 let del=document.createElement('button');del.className='danger';del.textContent='Excluir';del.addEventListener('click',async()=>{if(!confirm('Excluir este conteúdo do catálogo?'))return;del.disabled=true;try{await deleteDoc(doc(db,'conteudos',id))}catch(e){alert('Não foi possível excluir: '+e.code);del.disabled=false}});actions.append(edit,del);item.append(actions);$('items').append(item)}
</script>
</body></html>
